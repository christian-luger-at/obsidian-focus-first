name: Attest probe (temporary)

# TEMPORARY. Delete once Dependabot PR #81 is decided.
#
# Purpose: attest.yml only ever runs on a published release, so a bump of
# actions/attest-build-provenance cannot be validated by pull-request CI. Running
# the bumped action against a real release tag is not an option either: that
# permanently attaches an event_name=workflow_dispatch attestation to a shipped
# asset's digest, which Obsidian's review rejects and which cannot be deleted.
#
# So this probe runs the new action version against a throwaway file instead. No
# release, no shipped asset, and no digest that anything else refers to. The dummy
# is uploaded as a workflow artifact so the attestation can be verified locally
# with the exact bytes that were signed.
#
# What this proves: that the bumped action runs on the hosted runner and produces
# a bundle `gh attestation verify` accepts. What it cannot prove: that a real run
# records event_name=release. That field comes from the OIDC token claims of the
# triggering event, not from the action version, so it is unaffected by the bump.

on:
    workflow_dispatch:

permissions:
    contents: read # nothing is uploaded to any release
    id-token: write # OIDC identity used to sign the attestation
    attestations: write # store the attestation

jobs:
    probe:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Create a throwaway subject
              run: |
                  mkdir -p probe-out
                  printf 'attest-probe for run %s attempt %s\n' \
                      "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" > probe-out/probe.txt
                  sha256sum probe-out/probe.txt

            - name: Attest the throwaway subject
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: probe-out/probe.txt

            - name: Upload the throwaway subject for local verification
              uses: actions/upload-artifact@v7
              with:
                  name: attest-probe
                  path: probe-out/probe.txt
